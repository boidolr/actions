name: pre-commit update

on:
  workflow_call:
    inputs:
      branch:
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  pre-commit-update:
    runs-on: ubuntu-slim

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v7.0.1

    - uses: boidolr/actions/run-precommit@47e04d3a186f089ba7f55470b6a6519b0bd77bad # main
      id: precommit
      with:
        autoupdate: true

    - name: Push pre-commit changes
      uses: boidolr/actions/git-push@47e04d3a186f089ba7f55470b6a6519b0bd77bad # main
      if: ${{ steps.precommit.outputs.update_log }}
      with:
        message: |
          chore: update pre-commit config


          ${{ steps.precommit.outputs.update_log }}
        branch: ${{ inputs.branch }}
