name: Run pre-commit
description: Run prek with pre-commit configuration and test it still works

inputs:
  autoupdate:
    required: false
    description: Run autoupdate for configured pre-commit hooks
    default: 'false'
  working-directory:
    required: false
    description: Repository to run pre-commit in
    default: .
outputs:
  update_log:
    description: Log lines with updated pre-commit repositories, if any
    value: ${{ steps.autoupdate.outputs.UPDATES }}

runs:
  using: composite
  steps:
  - name: Install uv
    uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    with:
      version: ${{ env.UV_VERSION }}
      enable-cache: true
      cache-suffix: precommit
      cache-dependency-glob: ${{ inputs.working-directory }}/.pre-commit-config.yaml
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: 0.13.1

  - name: Cache prek
    uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ~/.cache/prek
      key: ${{ runner.os }}-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}

  - name: Run prek autoupdate
    id: autoupdate
    if: ${{ inputs.autoupdate == 'true' }}
    run: |
      logs=$(uvx prek autoupdate | grep updating || echo '')
      if [ -n "$logs" ]; then
        echo "UPDATES<<EOF" >> $GITHUB_OUTPUT
        echo "${logs}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      fi
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    env:
      UV_PYTHON_PREFERENCE: only-managed

  - name: Run prek
    run: uvx prek run --show-diff-on-failure --all-files
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    env:
      UV_PYTHON_PREFERENCE: only-managed
